name: Update NZIHL Scoring Leaders

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate latest top 10 graphic
        run: npm run build

      - name: Commit output files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update NZIHL top 10 scoring leaders graphic"
          file_pattern: output/top10.json output/NZIHL_top10.png output/goalies.json output/NZIHL_goalies.png
